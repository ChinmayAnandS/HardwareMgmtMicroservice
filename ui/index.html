<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Hardware administration</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M16 6.5 25 11v10l-9 4.5L7 21V11z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M7 11l9 4.5L25 11M16 15.5v10' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css"><script defer src="/schema.js"></script><script defer src="/rpc.js"></script><script defer src="/app.js"></script></head>
<body>
<a class="skip" href="#screen">Skip to content</a>
<header>
  <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M16 6.5 25 11v10l-9 4.5L7 21V11z"/><path d="M7 11l9 4.5L25 11M16 15.5v10"/></svg>
  <h1>Hardware administration</h1>
  <span id="identity"></span>
  <button id="signout" hidden>Sign out</button>
</header>
<section id="login">
  <div class="login-card">
    <h2>Administrator sign in</h2>
    <div class="login-badges"><span>Secure access</span><span>Hardware ledger</span></div>
    <p class="lead">Manage hardware pools, project reservations, checkouts and the audit trail.</p>
    <form id="password-login" hidden><label>Team name<input name="name" maxlength="40" pattern="[A-Za-z0-9._\-]{1,40}" autocomplete="username" required></label><label>Team code<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button></form>
    <form id="local-login" hidden><label>Local development code<input name="code" type="password" minlength="20" autocomplete="off" required></label><button class="primary">Sign in locally</button></form>
  </div>
</section>
<div id="app" hidden>
  <nav aria-label="Administration">
    <button data-screen="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Dashboard</button>
    <button data-screen="hardware"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>Hardware</button>
    <button data-screen="projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>Project inventory</button>
    <button data-screen="adjustments"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Stock adjustments</button>
    <button data-screen="checkouts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14m0 0-3.5-3.5M18 8l-3.5 3.5M20 16H6m0 0 3.5-3.5M6 16l3.5 3.5"/></svg>Checkout management</button>
    <button data-screen="transactions"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Transaction history</button>
  </nav>
  <main id="screen"></main>
</div>
<p id="message" role="status" aria-live="polite"></p>
<div id="tip" role="tooltip" hidden></div>
<dialog id="editor" aria-labelledby="edit-title"><form id="edit-form"><h2 id="edit-title"></h2><div id="current"></div><div id="fields"></div><div class="dialog-actions"><button type="button" id="cancel">Cancel</button><button id="save" class="primary">Review and confirm</button></div></form></dialog>
<dialog id="qr" aria-labelledby="qr-title"><form method="dialog"><h2 id="qr-title"></h2><img id="qr-image" alt="Hardware QR code" width="200" height="200"><pre id="qr-payload"></pre><div class="dialog-actions"><button>Close</button></div></form></dialog>
<dialog id="availability" aria-labelledby="availability-title">
  <form method="dialog">
    <h2 id="availability-title">Availability</h2>
    <div id="availability-results"></div>
    <div class="dialog-actions"><button>Close</button></div>
  </form>
</dialog>
</body></html>
