# Push to main: build the images for that commit, apply the prod Terraform stack (logging, alerts, app
# shape), then roll the new version out gradually (10% > 50% > 100%) with automatic rollback if the
# new revision fails its smoke test or health gates. Needs the GitHub Environment "prod"
# (see docs/PRODUCTION.md).
#
# A push only deploys when the repository variable AUTO_DEPLOY_PROD is "true". Running the workflow by
# hand always deploys. A rollout is never cancelled half-way: it finishes or rolls itself back.
name: deploy-prod
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.commitlintrc.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-dev.yml'
      - '.github/workflows/destroy-dev-preview.yml'
  workflow_dispatch:
    inputs:
      api_steps:
        description: Traffic steps for the API, each a percentage, ending in 100
        type: string
        default: '10,50,100'
      bake_seconds:
        description: Seconds to watch the new API revision after each traffic step
        type: string
        default: '180'
permissions:
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_PROD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.refs.outputs.api }}
      web_image: ${{ steps.refs.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the gRPC API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.azure
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
      - name: Build and push the website image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}-web:${{ github.sha }}
      - name: Pin both images by digest
        id: refs
        run: |
          echo "api=${{ steps.name.outputs.image }}@${{ steps.api.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "web=${{ steps.name.outputs.image }}-web@${{ steps.web.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: hardware-grpc
      API_APP: hardware-grpc-app
      WEB_APP: hardware-grpc-webapp
      # Terraform logs in to Azure itself with the job's GitHub OIDC token.
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ops_email: ${{ vars.OPS_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Apply the prod Terraform stack (logging, alerts, app shape)
        working-directory: infra/terraform/stacks/prod
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=prod.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - name: Install the smoke-test tooling
        run: |
          pip install -r backend/requirements-dev.txt
          python scripts/generate-proto.py
      - name: Roll out the API (canary, with automatic rollback)
        env:
          IMAGE: ${{ needs.images.outputs.api_image }}
          STEPS: ${{ inputs.api_steps || '10,50,100' }}
          BAKE: ${{ inputs.bake_seconds || '180' }}
        run: bash infra/scripts/rollout.sh "$RESOURCE_GROUP" "$API_APP" "$IMAGE" "$STEPS" "$BAKE" grpc
      - name: Roll out the website
        env:
          IMAGE: ${{ needs.images.outputs.web_image }}
        run: bash infra/scripts/rollout.sh "$RESOURCE_GROUP" "$WEB_APP" "$IMAGE" 100 60 http
      - name: Revisions after the rollout
        if: always()
        run: |
          for app in "$API_APP" "$WEB_APP"; do
            echo "== $app"
            az containerapp revision list -g "$RESOURCE_GROUP" -n "$app" \
              --query "[?properties.active].{revision:name,traffic:properties.trafficWeight,health:properties.healthState,created:properties.createdTime}" -o table
          done
