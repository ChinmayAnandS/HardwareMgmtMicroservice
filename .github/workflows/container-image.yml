# Builds the Container Apps images on every push to dev (the gRPC API from Dockerfile.azure, and the
# website + gRPC-Web proxy from web/Dockerfile) and publishes them to
# GitHub Container Registry (free). No Azure credentials are stored in GitHub.
name: container-image
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the gRPC API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.azure
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
      - name: Build and push the website image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}-web:latest
            ${{ steps.name.outputs.image }}-web:${{ github.sha }}
      - name: How to deploy this build
        run: |
          {
            echo "### Images published"
            echo '`${{ steps.name.outputs.image }}:${{ github.sha }}` (gRPC API, ingress http2, port 50051)'
            echo '`${{ steps.name.outputs.image }}-web:${{ github.sha }}` (website, ingress http, port 8080)'
            echo
            echo "Update the apps (replace the app and resource group names):"
            echo '```'
            echo "az containerapp update --name hardware-api --resource-group hardware-rg --image ${{ steps.name.outputs.image }}:${{ github.sha }}"
            echo "az containerapp update --name hardware-web --resource-group hardware-rg --image ${{ steps.name.outputs.image }}-web:${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
