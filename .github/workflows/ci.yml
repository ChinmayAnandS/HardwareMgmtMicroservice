name: ci
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hardware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/generate-proto.py
      - run: ruff check backend scripts infra e2e
      - run: pip-audit -r backend/requirements.txt
      - run: python scripts/generate-ui-schema.py
      - run: node --test scripts/tests/mongo-init.test.cjs scripts/tests/rpc-codec.test.cjs
      - run: node --check ui/app.js && node --check ui/rpc.js
      - run: |
          python scripts/local-secrets.py
          docker compose up -d --build --wait ui
          mkdir -p test-results
          chmod 777 test-results
          docker compose --profile test run --build --rm tests
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: test-results, path: test-results/}
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
      - run: |
          docker build -f Dockerfile.azure -t hardware-api:${{ github.sha }} .
          docker build -f web/Dockerfile -t hardware-web:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hardware-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hardware-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-package-lock @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
      - name: Lint the commits in this pull request
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Lint the pull request title (it becomes the commit message on a squash merge)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose
      - name: Lint the pushed commit
        if: github.event_name != 'pull_request'
        run: npx commitlint --last --verbose
