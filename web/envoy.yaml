# Browser (gRPC-Web over HTTP/1.1) -> Envoy -> the hardware API app (gRPC over HTTP/2, TLS).
# The double-underscore placeholders below are filled in by supervise.py from the API_HOST, API_PORT
# and API_TLS environment variables.
static_resources:
  listeners:
  - name: grpc_web
    address: {socket_address: {address: 127.0.0.1, port_value: 8081}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: grpc_web
          codec_type: AUTO
          route_config:
            name: hardware
            virtual_hosts:
            - name: hardware
              domains: ["*"]
              routes:
              - match: {prefix: "/hardware.v1."}
                # The Container Apps ingress routes by Host, so address the API app, not this one.
                route: {cluster: hardware_api, timeout: 60s, host_rewrite_literal: "__API_HOST__"}
          http_filters:
          # GET /ready answers 200 only while the API passes its gRPC health check.
          - name: envoy.filters.http.health_check
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
              pass_through_mode: false
              headers:
              - name: ":path"
                string_match: {exact: "/ready"}
              cluster_min_healthy_percentages:
                hardware_api: {value: 100}
          - name: envoy.filters.http.grpc_web
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: hardware_api
    type: STRICT_DNS
    connect_timeout: 5s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    health_checks:
    - timeout: 2s
      interval: 5s
      unhealthy_threshold: 2
      healthy_threshold: 1
      grpc_health_check: {authority: "__API_HOST__"}
__API_TLS__
    load_assignment:
      cluster_name: hardware_api
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: "__API_HOST__", port_value: __API_PORT__}}}
